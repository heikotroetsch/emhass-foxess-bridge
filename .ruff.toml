# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"
# Personal analysis notebooks and data live here, outside the integration.
extend-exclude = ["analysis"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "D"]
# Real-API tiers print their findings on purpose (run with -s).
"tests/contract/**" = ["T201"]
# Operator scripts: they print, they use literal numbers, docstrings per function add nothing.
"scripts/**" = ["T201", "D103", "PLR2004", "PLR0915", "INP001", "S310"]
