name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the zip HACS downloads.
# The tag must equal the version in manifest.json; scripts/release does both.

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: "Build and attach the HACS zip"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check that the tag matches manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/emhass_foxess_bridge/manifest.json'))['version'])")
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::release tag ${TAG} does not match manifest.json version ${VERSION}. Run scripts/release ${TAG#v} and tag again."
            exit 1
          fi
          echo "releasing version ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements_common.txt
            requirements_dev.txt

      - name: Install requirements
        run: |
          python3 -m pip install -r requirements_common.txt
          python3 -m pip install -r requirements_dev.txt

      - name: Run the test suite on the tagged code
        run: python3 -m pytest tests/unit tests/component tests/contract -q -p no:cacheprovider

      - name: Build the zip HACS installs
        run: |
          cd custom_components/emhass_foxess_bridge
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r ../../emhass_foxess_bridge.zip . -x '*.pyc'
          cd ../..
          unzip -l emhass_foxess_bridge.zip

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" emhass_foxess_bridge.zip --clobber
