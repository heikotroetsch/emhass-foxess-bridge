name: Release

# Pushing a tag vX.Y.Z creates the GitHub release with the zip HACS installs.
# A tag with a suffix such as v0.2.0-beta.1 becomes a pre-release. The tag must
# equal the version in manifest.json; `scripts/release X.Y.Z --push` does all of
# it. Re-run for an existing tag with "Run workflow" and the tag name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: "Build the HACS zip and publish the release"
    runs-on: "ubuntu-latest"
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check that the tag matches manifest.json
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/emhass_foxess_bridge/manifest.json'))['version'])")
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match manifest.json version ${VERSION}. Use scripts/release ${TAG#v}."
            exit 1
          fi
          echo "releasing version ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements_common.txt
            requirements_dev.txt

      - name: Install requirements
        run: |
          python3 -m pip install -r requirements_common.txt
          python3 -m pip install -r requirements_dev.txt

      - name: Run the test suite on the tagged code
        run: python3 -m pytest tests/unit tests/component tests/contract -q -p no:cacheprovider

      - name: Build the zip HACS installs
        run: |
          cd custom_components/emhass_foxess_bridge
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r ../../emhass_foxess_bridge.zip . -x '*.pyc'
          cd ../..
          unzip -l emhass_foxess_bridge.zip

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["TAG"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = match.group(1).strip() if match else ""
          if not body:
              body = "See CHANGELOG.md."
          notes = (
              f"{body}\n\n"
              "## Install\n\n"
              "HACS: add this repository as a custom repository of type *Integration*, "
              "then install this version (pre-releases need *Show beta versions*). "
              "Manual: unpack `emhass_foxess_bridge.zip` into `config/custom_components/emhass_foxess_bridge/`.\n"
          )
          Path("release_notes.md").write_text(notes)
          print(notes)
          PY

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} exists, replacing the asset"
            gh release upload "${TAG}" emhass_foxess_bridge.zip --clobber
          else
            PRERELEASE=""
            case "${TAG}" in *-*) PRERELEASE="--prerelease" ;; esac
            gh release create "${TAG}" emhass_foxess_bridge.zip \
              --verify-tag --title "${TAG}" --notes-file release_notes.md ${PRERELEASE}
          fi
          gh release view "${TAG}" --json tagName,isPrerelease,assets --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
