---
name: "Bug report"
description: "Something in the bridge does not behave as documented"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the existing issues first. For problems
        with the FoxESS cloud connection itself (API key, sensors, logging in), open the
        issue at [ha-foxess-openapi](https://github.com/duquedaniel/ha-foxess-openapi/issues);
        for optimisation results, at [EMHASS](https://github.com/davidusb-geek/emhass/issues).
  - type: textarea
    attributes:
      label: "What happened"
      description: "What did the bridge do, and what did you expect instead?"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "How to reproduce"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    attributes:
      label: "Inverter model and firmware"
      placeholder: "H3-5.0-E, master 1.91, manager 1.81"
    validations:
      required: true
  - type: input
    attributes:
      label: "Versions"
      placeholder: "Home Assistant 2026.10.4, EMHASS FoxESS Bridge 0.1.0, ha-foxess-openapi 0.1.2, EMHASS 0.18.7"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Diagnostics download"
      description: "Settings > Devices & services > EMHASS FoxESS Bridge > three dots > Download diagnostics. Serials and the API key are redacted. Drag the file here."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Debug log"
      description: "Enable debug logging for the integration (three dots > Enable debug logging), reproduce, disable it again and attach the downloaded log."
      render: text
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: The FoxESS Cloud Open API integration shows live values for this inverter.
          required: true
        - label: This issue describes one problem.
          required: true
