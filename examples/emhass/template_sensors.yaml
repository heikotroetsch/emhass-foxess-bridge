# EMHASS FoxESS Bridge: W versions of the kW power sensors from ha-foxess-openapi.
# Included from configuration.yaml via `template: !include emhass_template_sensors.yaml`.
- sensor:
    - name: "FoxESS PV power W"
      unique_id: foxess_pv_power_w
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.foxess_station_pv_power') | float(0) * 1000) | round(0) }}"
      availability: "{{ has_value('sensor.foxess_station_pv_power') }}"
    - name: "FoxESS load power W"
      unique_id: foxess_load_power_w
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.foxess_station_load_power') | float(0) * 1000) | round(0) }}"
      availability: "{{ has_value('sensor.foxess_station_load_power') }}"
